name: CI/CD

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The root package-lock.json was generated on macOS and lacks the linux binaries
# (see Dockerfile), so the jobs install each app from its own lockfile
# (frontend/package-lock.json, backend/package-lock.json) with --no-workspaces.
jobs:
  backend:
    name: Backend (Express API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # engines: >=22, Dockerfile: node:22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-workspaces --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test (start API, check /api/health)
        env:
          NODE_ENV: production
          PORT: '4000'
          SESSION_SECRET: ci-insecure-dummy-session-secret
          SITE_URL: http://localhost:3000
          API_URL: http://localhost:4000
          CORS_ORIGINS: http://localhost:3000
          DATABASE_URL: ./data/ci.db
        run: |
          node dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy build-time values (frontend/.env.example). The API is not running during
      # the build, so the ECONNREFUSED logs from server components are expected.
      API_INTERNAL_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: https://major.kg
      NEXT_PUBLIC_FACEIT_LIVE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-workspaces --no-audit --no-fund

      # TODO: `next lint` was removed in Next.js 16 and ESLint is not configured,
      # so this script always fails. Migrate to the ESLint CLI, then remove continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same image docker-compose.prod.yml builds (api + web), default build args.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: majorkg-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # VPS deploy (deploy/README.md, "Обновления"): deploy/deploy.sh backs up the
  # SQLite DB, git pull --ff-only, rebuilds the image, restarts and waits for /api/health.
  deploy:
    name: Deploy (VPS)
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Run deploy/deploy.sh on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            bash deploy/deploy.sh
