# MAJOR KG — системный nginx перед контейнерами docker.
# Кладется в /etc/nginx/sites-available/major.kg и линкуется в sites-enabled.
#
# Трафик: браузер -> Cloudflare -> nginx -> контейнер (127.0.0.1).
#   /api/*  -> majorkg-api  (Express)
#   всё остальное -> majorkg-web (Next.js)
#
# /api/* отдается бэкенду напрямую, а не через rewrites Next.js: на один
# хоп меньше, а cookie сессии все равно остается same-origin.

upstream majorkg_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream majorkg_api {
    server 127.0.0.1:4100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name major.kg www.major.kg;

    # Обновление сертификата должно проходить до редиректа на https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://major.kg$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.major.kg;

    ssl_certificate     /etc/ssl/major.kg/cert.pem;
    ssl_certificate_key /etc/ssl/major.kg/key.pem;
    include /etc/nginx/snippets/major.kg-ssl.conf;

    return 301 https://major.kg$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name major.kg;

    # Origin-сертификат Cloudflare: его проверяет только CF, браузер видит
    # сертификат самого CF. Требует режима Full (strict) в панели.
    ssl_certificate     /etc/ssl/major.kg/cert.pem;
    ssl_certificate_key /etc/ssl/major.kg/key.pem;
    include /etc/nginx/snippets/major.kg-ssl.conf;

    # Настоящий IP клиента вместо адреса Cloudflare. Без этого лимитер
    # в backend/src/middleware/rate-limit.ts посчитает всех игроков
    # за одного — они приходят с горстки адресов CF.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/major.kg.access.log;
    error_log  /var/log/nginx/major.kg.error.log;

    # Потолок тела запроса: API принимает json до 256kb.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_redirect off;

    location /api/ {
        proxy_pass http://majorkg_api;
        # Вход через Steam уходит на сторонний сервис и возвращается —
        # короткий таймаут тут обрывал бы логин.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://majorkg_web;
        proxy_read_timeout 60s;
    }
}
