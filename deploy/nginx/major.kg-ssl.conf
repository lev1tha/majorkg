# Общие параметры TLS для major.kg.
# Кладется в /etc/nginx/snippets/major.kg-ssl.conf.
#
# Отдельным файлом, потому что подключается из двух server-блоков
# (apex и www), и потому что certbot на этом сервере не стоит —
# готового options-ssl-nginx.conf, который он обычно приносит, нет.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:majorkg_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling не включаем: у origin-сертификата Cloudflare нет
# OCSP-респондера, nginx только писал бы ошибки в лог.
